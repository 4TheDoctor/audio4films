[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "audio4films"
version = "0.1.0"
description = "Add a dubbed audio track from one release to a better video release, in sync, without re-encoding."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "The Doc (4TheDoctor)" }]
keywords = ["ffmpeg", "dubbing", "audio sync", "mkv", "hdr", "dolby vision", "stremio"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
audio4films = "audio4films.cli:main"

[project.urls]
Homepage = "https://github.com/4TheDoctor/audio4films"
Issues = "https://github.com/4TheDoctor/audio4films/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/audio4films"]

[tool.pytest.ini_options]
testpaths = ["tests"]
